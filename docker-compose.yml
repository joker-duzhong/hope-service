services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: hope-postgres
    restart: unless-stopped
    # 数据库初始化依然使用这些基础变量
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hope_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: hope-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 应用
  app:
    build: .
    container_name: hope-app
    restart: unless-stopped
    # 🔴 核心改动：直接挂载整个 .env 文件
    env_file:
      - .env
    environment:
      # 🔴 核心覆盖：覆盖掉 .env 里的 localhost，强制使用 docker 内部容器名通信
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build: .
    container_name: hope-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info

  # Celery Beat (定时任务调度)
  celery-beat:
    build: .
    container_name: hope-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data: